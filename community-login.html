<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Login | Hlokomela AI</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="logo.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-block">
        <div class="brand-mark">💧</div>
        <div>
          <p class="eyebrow">Community access</p>
          <h1>Hlokomela AI</h1>
        </div>
      </div>
      <p class="intro">Sign in or create an account to report water issues, track alerts, and see local updates.</p>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="register">Create Account</button>
      </div>

      <!-- Login form -->
      <form class="login-form" data-role="community" id="login-form">
        <label>Full name
          <input id="full-name-input" name="fullName" type="text" placeholder="Samukelisiwe" required>
        </label>
        <label>Phone or email
          <input name="email" type="email" placeholder="you@example.com" required>
        </label>
        <label>Password
          <input name="password" type="password" placeholder="Your password" required>
        </label>
        <button type="submit" data-i18n="login_button_text">Login to community dashboard</button>
      </form>

      <!-- Register form -->
      <form class="login-form register-form" data-role="community" id="register-form" hidden>
        <label>First name
          <input name="firstName" type="text" placeholder="Samukelisiwe" required>
        </label>
        <label>Last name
          <input name="lastName" type="text" placeholder="Phiri" required>
        </label>
        <label>Email address
          <input name="email" type="email" placeholder="you@example.com" required>
        </label>
        <label>Phone number (optional)
          <input name="phone" type="tel" placeholder="+27 71 234 5678">
        </label>
        <label>Password
          <input name="password" type="password" placeholder="Min 6 characters" required minlength="6">
        </label>
        <button type="submit">Create account &amp; sign in</button>
      </form>

      <p class="form-error" id="login-error" role="alert" hidden></p>
      <p class="demo-hint">🔓 Demo: use any name, email &amp; any password to enter</p>
      <a class="back-link" href="index.html">Back to home</a>
    </section>
  </main>
  <script src="ai.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
