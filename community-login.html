<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Login | Hlokomela AI</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="logo.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-block">
        <div class="brand-mark">◌</div>
        <div>
          <p class="eyebrow">Community access</p>
          <h1>Welcome back</h1>
        </div>
      </div>
      <p class="intro" data-i18n="community_login_intro">Sign in to report issues, track alerts, and see local updates.</p>
      <form class="login-form" data-role="community">
        <label>Full name
          <input id="full-name-input" name="fullName" type="text" placeholder="Samukelisiwe" required>
        </label>
        <label>Phone or email
          <input name="email" type="email" placeholder="you@example.com" required>
        </label>
        <label>Password
          <input name="password" type="password" placeholder="Your password" required>
        </label>
        <button type="submit" data-i18n="login_button_text">Login to community dashboard</button>
      </form>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <p class="demo-hint">🔓 Demo: use any name, email &amp; any password to enter</p>
      <a class="back-link" href="index.html">Back to home</a>
    </section>
  </main>
  <script src="ai.js"></script>
  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
